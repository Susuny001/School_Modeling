<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Campus 当前轻量版 - 第一人称自由移动</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fb5c1;font-family:system-ui,-apple-system,"Segoe UI",Arial,"Microsoft YaHei",sans-serif}canvas{display:block;width:100%;height:100%;outline:none}.hud{position:fixed;left:14px;top:14px;z-index:5;background:rgba(16,20,23,.86);color:#f7f7f7;padding:10px 12px;border:1px solid rgba(255,255,255,.18);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.26);min-width:310px;font-size:13px;line-height:1.5;backdrop-filter:blur(4px)}.title{font-size:15px;font-weight:750;margin-bottom:2px}.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.muted{opacity:.78}.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:6px}button,input{font:inherit}button{border:1px solid rgba(255,255,255,.22);background:#252c31;color:white;border-radius:7px;padding:5px 9px;cursor:pointer}button:hover{background:#333d44}.settings{position:fixed;right:14px;top:14px;z-index:8;width:min(390px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;background:rgba(18,22,26,.95);color:#fff;padding:14px;border:1px solid rgba(255,255,255,.19);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.35)}.settings[hidden]{display:none}.settings h2{font-size:17px;margin:0 0 8px}.settingline{display:grid;grid-template-columns:80px 1fr 58px;gap:9px;align-items:center;margin:8px 0}.bindgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.bind{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#20272c;border-radius:8px;padding:6px 8px}.bind button{min-width:82px}.overlay{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.16);color:#fff;text-align:center}.overlay[hidden]{display:none}.enter{background:rgba(14,18,21,.88);border:1px solid rgba(255,255,255,.28);border-radius:14px;padding:18px 22px;box-shadow:0 10px 32px rgba(0,0,0,.35);max-width:430px}.enter strong{display:block;font-size:21px;margin-bottom:7px}.enter small{display:block;opacity:.82;line-height:1.55}.reticle{position:fixed;z-index:4;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none;opacity:.8}.reticle:before,.reticle:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}.reticle:before{left:8px;top:2px;width:2px;height:14px}.reticle:after{left:2px;top:8px;width:14px;height:2px}.error{color:#ffb7b7}.ok{color:#c7f3c4}
</style>

<body>
<canvas id="c" tabindex="0"></canvas>
<div class="reticle" id="reticle"></div>
<div class="hud">
  <div class="title">Campus 当前轻量版 · 第一人称自由移动</div>
  <div id="load" class="muted">正在解析内置模型…</div>
  <div id="coord" class="mono">X 0.0　Y 0.0　Z 0.0</div>
  <div id="angle" class="mono">水平角 0.0°　俯仰角 0.0°</div>
  <div id="buildingViews">
    <div class="row"><button data-building-view="south">南侧道路</button><button data-building-view="foodsite">食堂入口</button><button data-building-view="service">食堂后场</button><button data-building-view="parking">科学楼前场</button></div>
    <div class="row"><button data-building-view="admin">行政楼外观</button><button data-building-view="hall">行政大厅</button><button data-building-view="dorm">五栋宿舍</button><button data-building-view="corridor">直楼走廊</button><button data-building-view="angledCorridor">折角楼走廊</button><button data-building-view="statue">孔子像</button></div>
  </div>
  <div id="controlHint" class="muted"></div><div id="mouseState" role="status" class="ok">拖动模式：按住画面左键转向</div>
  <div class="row"><button id="captureBtn">进入鼠标视角</button><button id="teachingBtn">看教学楼</button><button id="overviewBtn">看全校</button><button id="lightingBtn">光影：开</button><button id="plazaBtn">到旗台</button><button id="settingsBtn">设置</button><button id="resetPos">回到教学楼</button></div>
</div>
<div class="settings" id="settings" hidden>
  <h2>控制设置</h2>
  <div class="muted">点击任一键位按钮后，直接按下新的按键。设置保存在当前浏览器。</div>
  <div class="bindgrid" id="bindgrid"></div>
  <div class="settingline"><span>鼠标灵敏度</span><input id="sens" type="range" min="0.20" max="2.00" step="0.05"><output id="sensOut"></output></div>
  <div class="settingline"><span>移动速度</span><input id="speed" type="range" min="2" max="30" step="1"><output id="speedOut"></output></div>
  <div class="settingline"><span>视野 FOV</span><input id="fov" type="range" min="35" max="80" step="1"><output id="fovOut"></output></div>
  <div class="muted" style="margin-top:10px">传送到坐标（保持当前水平角 / 俯仰角不变）</div>
  <div class="row"><input id="tx" class="mono" type="number" step="0.1" placeholder="X" style="width:78px"><input id="ty" class="mono" type="number" step="0.1" placeholder="Y" style="width:78px"><input id="tz" class="mono" type="number" step="0.1" placeholder="Z" style="width:78px"><button id="teleport">传送</button></div>
  <div class="muted" style="margin-top:10px">旧版本定位坐标（用于追踪修改，不代表照片机位已标定）</div>
  <div class="row" id="presetViews"><button data-v="1">视角1</button><button data-v="2">视角2</button><button data-v="3">视角3</button><button data-v="4">视角4</button><button data-v="5">视角5</button><button data-v="6">视角6</button></div>
  <div class="row"><button id="defaults">恢复默认控制</button><button id="closeSettings">关闭设置</button></div>
</div>
<div class="overlay" id="overlay" hidden>
  <div class="enter" id="overlayCard">
    <strong>点击进入地图</strong>
    <small>浏览器要求一次点击后才能捕获鼠标。进入后直接移动鼠标调整视角；按 ESC 立即退出鼠标视角。模型、材质与查看器全部内置，不需要网络或本地服务器。</small>
  </div>
</div>
